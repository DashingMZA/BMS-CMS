allowBuilds:
  esbuild: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@blocknote/core@0.56.0'
  - '@blocknote/mantine@0.56.0'
  - '@blocknote/react@0.56.0'
  - '@vercel/blob@2.8.2'
  - lucide-react@1.57.0
  - nodemailer@10.1.1

# pnpm 12 no longer reads the "pnpm" field in package.json — workspace-level
# settings live here instead.
#
# Single source of truth for the two versions that must stay unified across
# the tree: the catalog pins them once, package.json references them with
# `catalog:`, and the overrides below force transitive copies onto the same
# line. (The old "$nodemailer" / "$postcss" override syntax is deprecated in
# pnpm 12 — this is its replacement.)
catalogs:
  default:
    nodemailer: ^10.1.1
    postcss: ^8.5.30

overrides:
  "next-auth>nodemailer": "catalog:default"
  "next>postcss": "catalog:default"
  # GHSA-67mh-4wv8-2f99: esbuild <=0.24.2 lets any website read the dev
  # server's responses. It reaches the tree only through drizzle-kit's
  # @esbuild-kit chain (dev tooling, never shipped), and drizzle-kit has
  # not moved — the override forces the patched line (DEP-001).
  "esbuild": "^0.25.0"
