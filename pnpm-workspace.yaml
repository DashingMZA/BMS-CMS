allowBuilds:
  esbuild: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@blocknote/core@0.56.0'
  - '@blocknote/mantine@0.56.0'
  - '@blocknote/react@0.56.0'
  - '@vercel/blob@2.8.2'
  - lucide-react@1.57.0
  - nodemailer@10.1.1

# pnpm 12 no longer reads the "pnpm" field in package.json — workspace-level
# settings live here instead. These force a single nodemailer and a single
# postcss across the tree (previously written as npm-style "overrides" in
# package.json, which pnpm silently ignored).
overrides:
  "next-auth>nodemailer": "$nodemailer"
  "next>postcss": "$postcss"
